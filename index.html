<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>La Séance</title>
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon-v3.png">
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  :root{
    --bg:#000000; --surface:#1C1C1E; --surface2:#2C2C2E; --fill:#3A3A3C;
    --sep:rgba(255,255,255,.08);
    --txt:#F5F5F7; --sec:#98989F; --ter:#636366;
    --tint:#FF375F; --a:#FF375F; --b:#30D158; --f:#FF9F0A;
  }
  html{font-size:16px}
  body{
    background:var(--bg);color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
    min-height:100vh;min-height:100dvh;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    overscroll-behavior:none;
    -webkit-font-smoothing:antialiased;
  }
  #app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
  .pad{padding:20px 20px 32px}

  h1{font-size:34px;font-weight:800;letter-spacing:-.022em;line-height:1.06}
  h2{font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
  p.sub{color:var(--sec);font-size:15px;margin-top:6px;line-height:1.45;letter-spacing:-.01em}
  .num{font-variant-numeric:tabular-nums;font-weight:800;letter-spacing:-.02em}
  .sect{font-size:12.5px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;
    color:var(--sec);margin:26px 4px 8px}
  .sect:first-of-type{margin-top:22px}

  button,a.btn{font-family:inherit;border:0;cursor:pointer;display:flex;align-items:center;
    justify-content:center;gap:8px;text-decoration:none;color:inherit;background:none;
    transition:opacity .12s,transform .12s}
  button:active{opacity:.6}

  /* boutons */
  .primary{width:100%;background:var(--tint);color:#fff;font-weight:600;font-size:17px;
    letter-spacing:-.01em;padding:16px;border-radius:14px}
  .secondary{width:100%;background:var(--surface);color:var(--txt);font-weight:600;font-size:17px;
    letter-spacing:-.01em;padding:16px;border-radius:14px}
  .plain{background:none;color:var(--tint);font-size:15px;font-weight:500;padding:12px}

  /* listes groupées façon iOS */
  .group{background:var(--surface);border-radius:16px;overflow:hidden}
  .cell{display:flex;align-items:center;gap:12px;padding:13px 16px;min-height:52px;width:100%;
    text-align:left;justify-content:flex-start}
  .cell+.cell{border-top:1px solid var(--sep)}
  .cell .grow{flex:1;min-width:0}
  .cell .title{font-size:16px;font-weight:500;letter-spacing:-.01em}
  .cell .caption{font-size:13px;color:var(--sec);margin-top:2px;line-height:1.35}
  .cell .value{font-size:16px;color:var(--sec);font-variant-numeric:tabular-nums}
  .chev{color:var(--ter);font-size:20px;font-weight:600;line-height:1;flex:0 0 auto}
  .dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}

  /* contrôle segmenté */
  .seg{display:flex;background:var(--surface);border-radius:12px;padding:3px;gap:3px}
  .segitem{flex:1;padding:9px 0;border-radius:9px;font-size:15px;font-weight:600;
    color:var(--sec);letter-spacing:-.01em}
  .segitem.on{background:var(--fill);color:var(--txt);
    box-shadow:0 1px 4px rgba(0,0,0,.35)}

  input{width:100%;background:var(--surface);border:0;border-radius:12px;padding:13px 15px;
    color:var(--txt);font-size:15px;font-family:inherit;outline:0;letter-spacing:-.01em}
  input::placeholder{color:var(--ter)}
  input:focus{box-shadow:0 0 0 1.5px var(--tint)}
  input.inline{background:none;border-radius:0;padding:11px 0;border-top:1px solid var(--sep)}
  input.inline:focus{box-shadow:none}
  .hint{font-size:12.5px;color:var(--ter);margin:8px 4px 0;line-height:1.45}

  /* réglages : stepper de repos */
  .stepper{display:flex;align-items:center;background:var(--surface2);border-radius:9px;overflow:hidden;flex:0 0 auto}
  .stepper button{width:38px;height:32px;font-size:19px;color:var(--txt);font-weight:500}
  .stepper .sv{width:48px;text-align:center;font-size:14px;font-variant-numeric:tabular-nums;
    color:var(--txt);border-left:1px solid var(--sep);border-right:1px solid var(--sep);
    align-self:stretch;display:flex;align-items:center;justify-content:center}

  .frow{display:flex;align-items:center;gap:12px;width:100%;margin-top:11px;
    padding-top:10px;border-top:1px solid var(--sep)}
  .flbl{font-size:13px;color:var(--ter);flex:0 0 auto;min-width:52px}
  .finput{flex:1;min-width:0;background:none;border:0;border-radius:0;padding:2px 0;
    font-size:14px;color:var(--sec);font-family:inherit;outline:0;letter-spacing:-.01em}
  .finput::placeholder{color:var(--ter);opacity:.7}
  .finput:focus{box-shadow:none;color:var(--txt)}

  /* écran séance */
  .nav{padding:14px 16px 8px;display:flex;align-items:center;justify-content:space-between;gap:8px}
  .navbtn{width:40px;height:40px;border-radius:50%;background:var(--surface);color:var(--sec);
    font-size:19px;font-weight:600;flex:0 0 auto}
  .navbtn.armed{background:var(--tint);color:#fff}
  .navmid{flex:1;text-align:center;overflow:hidden}
  .navtitle{font-size:13px;font-weight:600;letter-spacing:-.01em;display:flex;
    align-items:center;justify-content:center;gap:6px}
  .navsub{font-size:12px;color:var(--ter);font-variant-numeric:tabular-nums;margin-top:1px}
  .rail{display:flex;gap:2.5px;padding:0 20px 10px}
  .rail i{flex:1;height:3px;border-radius:2px;background:var(--surface2);display:block}
  .body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 20px}
  .ringwrap{position:relative;display:flex;align-items:center;justify-content:center}
  svg.ring{transform:rotate(-90deg)}
  .ringtxt{position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;padding:0 44px}
  .phase{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--sec)}
  .big{font-size:56px;line-height:1;margin-top:4px}
  .mid{font-size:46px;line-height:1;margin-top:4px}
  .under{font-size:13px;color:var(--sec);margin-top:8px;letter-spacing:-.01em}
  .exname{font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.12;text-align:center;margin-top:20px}
  .exsub{font-size:13.5px;color:var(--sec);text-align:center;margin-top:4px;letter-spacing:-.01em}
  .matline{font-size:12px;color:var(--ter);text-align:center;margin-top:7px;
    letter-spacing:.01em;padding:3px 12px;background:var(--surface);border-radius:8px}
  .exdet{font-size:13.5px;color:var(--sec);text-align:center;line-height:1.55;margin-top:12px;max-width:360px}
  .demo{margin-top:16px;background:var(--surface);color:var(--txt);font-size:14px;font-weight:500;
    padding:10px 16px;border-radius:20px;letter-spacing:-.01em}
  .demo b{color:var(--tint);font-weight:600}

  /* stepper de reps pendant la séance */
  .repbar{display:flex;align-items:center;gap:14px;margin-top:22px}
  .replbl{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--sec)}
  .repctl{display:flex;align-items:center;background:var(--surface);border-radius:12px;overflow:hidden}
  .repctl button{width:52px;height:44px;font-size:22px;color:var(--txt)}
  .repctl .repval{width:56px;align-self:stretch;display:flex;align-items:center;justify-content:center;
    font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;
    border-left:1px solid var(--sep);border-right:1px solid var(--sep)}

  .actions{padding:14px 20px calc(20px + env(safe-area-inset-bottom));display:flex;gap:10px}
  .actions button{flex:1;padding:17px;border-radius:14px;font-weight:600;font-size:17px;letter-spacing:-.01em}
  .neutral{background:var(--surface);color:var(--txt)}
  .square{flex:0 0 60px;font-size:20px}
  .stopline{width:100%;background:none;color:var(--ter);font-size:13px;padding:6px;
    margin-bottom:calc(12px + env(safe-area-inset-bottom))}
  .stopline.armed{color:var(--tint);font-weight:600}
  .pulse{animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
  .done{text-align:center;flex:1;display:flex;flex-direction:column;justify-content:center}

  /* carnet */
  .backline{display:flex;align-items:center;gap:2px;color:var(--tint);font-size:16px;
    font-weight:500;margin-bottom:14px;padding:4px 0;width:auto;align-self:flex-start}
  .card{background:var(--surface);border-radius:16px;margin-bottom:12px;overflow:hidden}
  .cardhead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 16px 11px}
  .carddate{font-size:15px;font-weight:600;letter-spacing:-.01em}
  .cardmeta{font-size:12.5px;color:var(--sec);margin-top:1px;font-variant-numeric:tabular-nums}
  .delbtn{color:var(--ter);font-size:13px;padding:6px 8px;border-radius:8px;flex:0 0 auto}
  .delbtn.armed{color:var(--tint);font-weight:600}
  .exrow{display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:10px 16px;border-top:1px solid var(--sep)}
  .exrowname{font-size:13.5px;color:var(--sec);letter-spacing:-.01em}
  .chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
  .chip{background:var(--surface2);color:var(--txt);font-size:14px;font-variant-numeric:tabular-nums;
    min-width:38px;height:32px;padding:0 10px;border-radius:9px;font-weight:600}
  .empty{text-align:center;color:var(--sec);font-size:14px;margin-top:52px;line-height:1.6;padding:0 20px}
  .tag{font-size:11px;font-weight:600;color:var(--f);background:rgba(255,159,10,.14);
    padding:3px 8px;border-radius:7px;flex:0 0 auto}

  /* feuille d'édition (bottom sheet) */
  .sheetback{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;
    backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:480px;margin:0 auto;
    background:var(--surface);border-radius:22px 22px 0 0;
    padding:20px 20px calc(24px + env(safe-area-inset-bottom));
    box-shadow:0 -8px 40px rgba(0,0,0,.5);animation:up .22s cubic-bezier(.2,.8,.3,1)}
  @keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
  .grab{width:36px;height:5px;border-radius:3px;background:var(--fill);margin:0 auto 16px}
  .sheettitle{font-size:17px;font-weight:700;text-align:center;letter-spacing:-.01em}
  .sheetsub{font-size:13px;color:var(--sec);text-align:center;margin-top:2px}
  .sheetnum{display:flex;align-items:center;justify-content:center;gap:22px;margin:22px 0 24px}
  .sheetnum button{width:56px;height:56px;border-radius:50%;background:var(--surface2);
    font-size:26px;color:var(--txt)}
  .sheetval{font-size:52px;font-weight:800;font-variant-numeric:tabular-nums;
    min-width:90px;text-align:center;letter-spacing:-.02em}

</style>
</head>
<body>
<div id="app"></div>

<script>
/* ================= DONNÉES ================= */
// Timestamps de la vidéo Eric Flag "La SEULE Vidéo Pour Commencer le Street Workout"
const BLOC_A=[
 {id:"tractions",nom:"Tractions",sub:"pronation ou supination",reps:"6 à 10 reps",
  detail:"Bras tendus en bas, initie le mouvement avec les omoplates, menton au-dessus de la barre. Corps gainé, jambes serrées non croisées.",rest:90,ts:64},
 {id:"dips",nom:"Dips",sub:"barres parallèles ou tréteaux",reps:"8 à 12 reps",
  detail:"Épaules poussées vers le bas, coudes le long du corps. Descends au moins jusqu'à l'angle droit au coude.",rest:90,ts:192},
 {id:"squat",nom:"Squat gobelet",sub:"un haltère contre la poitrine",reps:"12 à 15 reps",
  detail:"Genoux dans l'axe des pieds, dos droit, talons au sol. Descends aussi bas que ta mobilité le permet.",rest:60,ts:272},
 {id:"releves",nom:"Relevés de jambes",sub:"au sol ou suspendu",reps:"10 à 15 reps",
  detail:"Bas du dos plaqué, bassin en rétroversion. Aucun balancier, descente contrôlée.",rest:60,ts:331}];

const BLOC_B=[
 {id:"australiennes",nom:"Tractions australiennes",sub:"barre basse, table ou anneaux",reps:"8 à 12 reps",
  detail:"Omoplates vers l'arrière et vers le bas, va chercher le haut des pecs avec la barre. Corps droit et gainé.",rest:90,ts:374},
 {id:"pompes",nom:"Pompes",sub:"classiques ou pieds surélevés",reps:"10 à 15 reps",
  detail:"Coudes le long du corps, pecs qui frôlent le sol, épaules poussées vers l'avant en position haute.",rest:90,ts:412},
 {id:"fentes",nom:"Fentes bulgares",sub:"pied arrière sur une chaise",reps:"10 reps par jambe",
  detail:"Commence par ton côté faible. Genou avant dans l'axe, buste droit. Charge aux haltères dès que 12 reps passent facile.",rest:60,custom:true},
 {id:"hollow",nom:"Hollow body",sub:"gainage banane au sol",timed:40,
  detail:"Bas du dos plaqué au sol, bras tendus derrière la tête, jambes tendues légèrement décollées. Contracte comme pour t'enrouler, aucune cambrure lombaire.",rest:60,custom:true}];

const FIN_COMMUN=[
 {id:"elevations",nom:"Élévations latérales",sub:"élastique ou haltères légers",reps:"15 à 20 reps",series:3,
  detail:"Le plus important pour la silhouette en V. Tempo lent, monte à hauteur d'épaule, pas plus haut.",rest:45,custom:true},
 {id:"facepulls",nom:"Face pulls",sub:"élastique",reps:"15 à 20 reps",series:3,
  detail:"Assurance épaule : gros volume de tractions plus le service au tennis. Tire vers le front, coudes hauts.",rest:45,custom:true}];

const FIN_IMPAIRE=[
 {id:"militaire",nom:"Développé militaire",sub:"haltères, debout",reps:"10 à 12 reps",series:3,
  detail:"La poussée verticale chargée que la callisthénie ne couvre pas. Fessiers et abdos gainés, aucune cambrure.",rest:90,custom:true},
 {id:"triceps",nom:"Extensions triceps nuque",sub:"un haltère à deux mains",reps:"12 à 15 reps",series:3,
  detail:"Cible la longue portion du triceps. Coudes serrés vers l'avant, seul l'avant-bras bouge.",rest:60,custom:true}];

const FIN_PAIRE=[
 {id:"curl",nom:"Curl marteau",sub:"haltères, prise neutre",reps:"10 à 12 reps",series:3,
  detail:"Épaisseur du bras et de l'avant-bras. Coudes collés au buste, aucun élan des hanches.",rest:60,custom:true}];

const ALL_EXOS = BLOC_A.concat(BLOC_B,FIN_COMMUN,FIN_IMPAIRE,FIN_PAIRE);
const SECTIONS=[["Bloc A",BLOC_A],["Bloc B",BLOC_B],["Finition",FIN_COMMUN.concat(FIN_IMPAIRE,FIN_PAIRE)]];

// Matériel : par exercice (affiché pendant la séance) puis regroupé par équipement
const MAT={
 tractions:"Barre de traction + élastique",
 dips:"Barres parallèles ou anneaux",
 squat:"Un haltère",
 releves:"Tapis",
 australiennes:"Barre basse, table ou anneaux",
 pompes:"Tapis (optionnel)",
 fentes:"Banc ou chaise",
 hollow:"Tapis (optionnel)",
 elevations:"Haltères légers",
 facepulls:"Élastique",
 militaire:"Haltères",
 triceps:"Un haltère",
 curl:"Haltères"};

const MATERIEL=[
 {nom:"Barre de traction",detail:"Encadrement de porte, murale ou parc extérieur",exos:["tractions"]},
 {nom:"Barres parallèles ou anneaux",detail:"À défaut : deux chaises solides dos à dos",exos:["dips"]},
 {nom:"Barre basse ou anneaux",detail:"À défaut : le bord d'une table stable",exos:["australiennes"]},
 {nom:"Haltères",detail:"Une paire réglable couvre tout le programme",exos:["squat","elevations","militaire","triceps","curl","fentes"]},
 {nom:"Élastiques",detail:"Assistance aux tractions et résistance aux face pulls",exos:["tractions","facepulls"]},
 {nom:"Banc ou chaise",detail:"Pour poser le pied arrière",exos:["fentes"]},
 {nom:"Tapis",detail:"Confort au sol",exos:["releves","hollow","pompes"]}];
const REST_TOUR=120;
const COL={A:"#FF375F",B:"#30D158",F:"#FF9F0A"};

/* ================= ÉTAT : CONFIG ================= */
const DEF={tours:2,videoUrl:"",customLinks:{},restOverrides:{},sound:true,sessionCount:1};
let S=Object.assign({},DEF);
try{const raw=localStorage.getItem("seance-config");if(raw)S=Object.assign(S,JSON.parse(raw));}catch(e){}
const save=()=>{try{localStorage.setItem("seance-config",JSON.stringify(S));}catch(e){}};

/* ================= ÉTAT : CARNET (journal + niveaux) ================= */
let LOG={sessions:[]};
try{const rawLog=localStorage.getItem("seance-journal");if(rawLog)LOG=JSON.parse(rawLog);}catch(e){}
const saveLog=()=>{try{localStorage.setItem("seance-journal",JSON.stringify(LOG));}catch(e){}};

let NIVEAUX={};
try{const rawNiv=localStorage.getItem("seance-niveaux");if(rawNiv)NIVEAUX=JSON.parse(rawNiv);}catch(e){}
const saveNiveaux=()=>{try{localStorage.setItem("seance-niveaux",JSON.stringify(NIVEAUX));}catch(e){}};

let screen="accueil", seq=[], idx=0, phase="work", running=true;
let stepBase=0, stepAnchor=Date.now(), totBase=0, totAnchor=Date.now();
let elapsed=0, total=0, stopArmed=false, tickId=null, wake=null;
let sessionLog={}, pendingReps=0, carnetTab="hist", deleteArmed=null, editTarget=null;

/* ================= OUTILS ================= */
const fmt=s=>{const v=Math.max(0,Math.round(s));return Math.floor(v/60)+":"+String(v%60).padStart(2,"0");};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function formatDate(iso){
  try{
    const d=new Date(iso);
    return d.toLocaleDateString("fr-FR",{weekday:"short",day:"numeric",month:"short"})
      +" · "+d.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"});
  }catch(e){return iso;}
}

function suggestReps(step){
  const m=(step.reps||"").match(/\d+/g);
  if(!m)return 10;
  return Math.max.apply(null,m.map(Number));
}
function initPending(step){
  if(!step||step.timed){pendingReps=null;return;}
  const arr=sessionLog[step.id];
  pendingReps=(arr&&arr.length)?arr[arr.length-1]:suggestReps(step);
}

function saveSessionToJournal(partial){
  if(!Object.keys(sessionLog).length)return; // rien à enregistrer
  const record={
    id:Date.now(),
    date:new Date().toISOString(),
    sessionNumber:S.sessionCount,
    tours:S.tours,
    duration:Math.round(total),
    partial:!!partial,
    reps:JSON.parse(JSON.stringify(sessionLog))
  };
  LOG.sessions.push(record);
  if(LOG.sessions.length>200)LOG.sessions=LOG.sessions.slice(-200);
  saveLog();
}

let actx=null;
function beep(single){
  if(navigator.vibrate)navigator.vibrate(single?[90]:[180,90,180]);
  if(!S.sound)return;
  try{
    if(!actx)actx=new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state==="suspended")actx.resume();
    const offs=single?[0]:[0,.18,.36];
    offs.forEach((o,i)=>{
      const osc=actx.createOscillator(),g=actx.createGain();
      osc.type="sine";osc.frequency.value=(i===offs.length-1&&!single)?880:660;
      g.gain.setValueAtTime(.0001,actx.currentTime+o);
      g.gain.exponentialRampToValueAtTime(.4,actx.currentTime+o+.02);
      g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+o+.15);
      osc.connect(g);g.connect(actx.destination);
      osc.start(actx.currentTime+o);osc.stop(actx.currentTime+o+.16);
    });
  }catch(e){}
}

function buildSequence(){
  const steps=[], impaire=S.sessionCount%2===1;
  const bloc=impaire?"A":"B";
  const list=impaire?BLOC_A:BLOC_B;
  const pairs=[[list[0],list[1]],[list[2],list[3]]]; // paire 1 : agoniste/antagoniste haut du corps · paire 2 : bas du corps/core
  const r=ex=>S.restOverrides[ex.id]!==undefined?S.restOverrides[ex.id]:ex.rest;
  pairs.forEach(([exA,exB],pi)=>{
    const lastPair=pi===pairs.length-1;
    for(let t=1;t<=S.tours;t++){
      const lastRound=t===S.tours;
      [exA,exB].forEach((ex,ei)=>{
        const lastOfPair=lastRound&&ei===1;
        const finTout=lastOfPair&&lastPair;
        steps.push(Object.assign({},ex,{bloc:bloc,
          position:"Paire "+(pi+1)+"/2 · Tour "+t+"/"+S.tours+" · "+(ei+1)+"/2",
          rest:lastOfPair?(finTout?90:REST_TOUR):r(ex),
          restLabel:lastOfPair&&!finTout?"Repos avant la paire suivante":"Repos"}));
      });
    }
  });
  const fin=FIN_COMMUN.concat(impaire?FIN_IMPAIRE:FIN_PAIRE);
  fin.forEach((ex,ei)=>{
    for(let s=1;s<=ex.series;s++){
      const last=ei===fin.length-1&&s===ex.series;
      steps.push(Object.assign({},ex,{bloc:"F",
        position:"Finition · Série "+s+"/"+ex.series,
        rest:last?0:r(ex),restLabel:"Repos"}));
    }
  });
  return steps;
}

const lienDemo=ex=>{
  if(ex.custom)return S.customLinks[ex.id]||"";
  if(!S.videoUrl)return "";
  const base=S.videoUrl.split("&")[0].split("?t=")[0];
  return base+(base.includes("?")?"&":"?")+"t="+ex.ts+"s";
};

const resetStep=()=>{stepBase=0;stepAnchor=Date.now();elapsed=0;};

/* ================= BOUCLE ================= */
function tick(){
  if(screen!=="seance")return;
  if(running){
    elapsed=stepBase+(Date.now()-stepAnchor)/1000;
    total=totBase+(Date.now()-totAnchor)/1000;
  }
  const step=seq[idx];if(!step)return;
  const cible=phase==="rest"?step.rest:(step.timed||0);
  if(running&&cible&&elapsed>=cible){
    beep();
    if(phase==="rest"||step.rest===0){next();}
    else{phase="rest";resetStep();}
    render();return;
  }
  paintClock();
}
function paintClock(){
  const step=seq[idx];if(!step)return;
  const cible=phase==="rest"?step.rest:(step.timed||0);
  const restant=cible?Math.max(0,cible-elapsed):0;
  const prog=cible?Math.min(1,elapsed/cible):0;
  const t=document.getElementById("clock");
  if(t)t.textContent=cible?fmt(restant):fmt(elapsed);
  const tt=document.getElementById("tot");
  if(tt)tt.textContent=fmt(total);
  const c=document.getElementById("prog");
  if(c){
    const R=132,CIRC=2*Math.PI*R;
    const p=phase==="rest"?1-prog:prog;
    c.setAttribute("stroke-dashoffset",CIRC*(1-Math.min(1,Math.max(0,p))));
  }
}
function next(){
  if(idx+1>=seq.length){
    saveSessionToJournal(false);
    S.sessionCount++;save();
    screen="fin";
    return;
  }
  idx++;phase="work";resetStep();
  initPending(seq[idx]);
}

/* ================= ÉCRANS ================= */
function render(){
  const app=document.getElementById("app");
  if(screen==="accueil")app.innerHTML=viewAccueil();
  else if(screen==="reglages")app.innerHTML=viewReglages();
  else if(screen==="carnet")app.innerHTML=viewCarnet();
  else if(screen==="materiel")app.innerHTML=viewMateriel();
  else if(screen==="fin")app.innerHTML=viewFin();
  else app.innerHTML=viewSeance();
  bind();
  if(screen==="seance")paintClock();
}

}

   +'<p class="sub" style="margin-bottom:26px">'+seq.length+' passages · '+S.tours+' tour'

function viewSeance(){
  const step=seq[idx];
  const col=COL[step.bloc];
  const rest=phase==="rest";
  const cible=rest?step.rest:(step.timed||0);
  const lien=lienDemo(step);
  const R=132,CIRC=2*Math.PI*R;

  let inner;
  if(rest){
    inner='<div class="phase">'+esc(step.restLabel)+'</div>'
     +'<div class="num big" id="clock">'+fmt(cible)+'</div>'
     +'<div class="under">Ensuite : '+esc(seq[idx+1]?seq[idx+1].nom:"fin de séance")+'</div>';
  }else if(step.timed){
    inner='<div class="phase" style="color:'+col+'">Tiens la position</div>'
     +'<div class="num big" id="clock">'+fmt(step.timed)+'</div>';
  }else{
    inner='<div class="phase" style="color:'+col+'">En cours</div>'
     +'<div class="num mid" id="clock">0:00</div>'
     +'<div class="under">'+esc(step.reps)+'</div>';
  }

  const repbar=(!rest&&!step.timed)
   ?'<div class="repbar"><span class="replbl">Reps</span>'
    +'<div class="repctl"><button id="repminus">−</button>'
    +'<span class="repval">'+pendingReps+'</span>'
    +'<button id="repplus">+</button></div></div>'
   :'';

  return '<div class="nav">'
   +'<button class="navbtn stopbtn'+(stopArmed?' armed':'')+'" id="backTop">'+(stopArmed?'✕':'‹')+'</button>'
   +'<div class="navmid">'
   +'<div class="navtitle"><span class="dot" style="background:'+col+'"></span>'+esc(step.position)+'</div>'
   +'<div class="navsub" id="tot">0:00</div></div>'
   +'<button class="navbtn" id="pp">'+(running?"❙❙":"▶")+'</button></div>'
   +'<div class="rail">'+seq.map((s,i)=>'<i style="background:'
     +(i<idx?"#48484A":(i===idx?col:"var(--surface2)"))+'"></i>').join("")+'</div>'
   +'<div class="body"><div class="ringwrap">'
   +'<svg class="ring" width="286" height="286" viewBox="0 0 300 300">'
   +'<circle cx="150" cy="150" r="'+R+'" fill="none" stroke="var(--surface)" stroke-width="12"/>'
   +'<circle id="prog" cx="150" cy="150" r="'+R+'" fill="none" stroke="'+(rest?"#48484A":col)
   +'" stroke-width="12" stroke-linecap="round" stroke-dasharray="'+CIRC+'" stroke-dashoffset="'
   +(rest?0:CIRC)+'" style="transition:stroke-dashoffset .3s linear"/></svg>'
   +'<div class="ringtxt'+(running?'':' pulse')+'">'+inner+'</div></div>'
   +'<div class="exname">'+esc(step.nom)+'</div>'
   +'<div class="exsub">'+esc(step.sub)+'</div>'
   +(MAT[step.id]?'<div class="matline">'+esc(MAT[step.id])+'</div>':'')
   +'<div class="exdet">'+esc(step.detail)+'</div>'
   +(lien?'<a class="btn demo" href="'+esc(lien)+'" target="_blank" rel="noopener"><b>▶</b> Démonstration</a>'
        :'<button class="plain" id="toReg" style="font-size:13px;color:var(--ter);margin-top:8px">Ajouter un lien pour cet exercice</button>')
   +repbar
   +'</div>'
   +'<div class="actions">'
   +(rest
     ?'<button class="neutral" id="add30">+30 s</button>'
      +'<button id="skiprest" style="background:#F2F2F7;color:#000">Passer ›</button>'
     :'<button class="neutral square" id="skip">›</button>'
      +'<button id="done" style="background:var(--tint);color:#fff">Série terminée</button>')
   +'</div>'
   +'<button class="stopline stopbtn'+(stopArmed?' armed':'')+'" id="stopBottom">'
   +(stopArmed?"Appuie encore pour confirmer l'arrêt":"Arrêter la séance")+'</button>';
}

/* ================= ÉVÉNEMENTS ================= */
function bind(){
  const on=(id,fn)=>{const e=document.getElementById(id);if(e)e.onclick=fn;};

  document.querySelectorAll("[data-tour]").forEach(b=>b.onclick=()=>{
    S.tours=+b.dataset.tour;save();render();});
  const v=document.getElementById("vurl");
  if(v)v.oninput=e=>{S.videoUrl=e.target.value;save();};

  on("go",()=>{
    beep(true); // débloque l'audio sur mobile (nécessite un geste utilisateur)
    seq=buildSequence();idx=0;phase="work";running=true;
    stepBase=0;stepAnchor=Date.now();elapsed=0;
    totBase=0;totAnchor=Date.now();total=0;
    sessionLog={};initPending(seq[0]);
    screen="seance";requestWake();render();
  });
  on("toReg",()=>{screen="reglages";render();});
  on("toCarnet",()=>{screen="carnet";render();});
  on("toMat",()=>{screen="materiel";render();});
  on("back",()=>{screen="accueil";editTarget=null;render();});
  on("snd",()=>{S.sound=!S.sound;save();render();});
  on("home",()=>{screen="accueil";render();});

  document.querySelectorAll("[data-minus]").forEach(b=>b.onclick=()=>{
    const id=b.dataset.minus;
    const cur=S.restOverrides[id]!==undefined?S.restOverrides[id]:ALL_EXOS.find(x=>x.id===id).rest;
    S.restOverrides[id]=Math.max(0,cur-15);save();render();});
  document.querySelectorAll("[data-plus]").forEach(b=>b.onclick=()=>{
    const id=b.dataset.plus;
    const cur=S.restOverrides[id]!==undefined?S.restOverrides[id]:ALL_EXOS.find(x=>x.id===id).rest;
    S.restOverrides[id]=cur+15;save();render();});
  document.querySelectorAll("[data-link]").forEach(i=>i.oninput=e=>{
    S.customLinks[i.dataset.link]=e.target.value;save();});

  document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{
    carnetTab=b.dataset.tab;render();});
  document.querySelectorAll("[data-niv-variante]").forEach(i=>i.oninput=e=>{
    const id=i.dataset.nivVariante;
    NIVEAUX[id]=Object.assign({},NIVEAUX[id],{variante:e.target.value,date:new Date().toISOString()});
    saveNiveaux();});
  document.querySelectorAll("[data-niv-note]").forEach(i=>i.oninput=e=>{
    const id=i.dataset.nivNote;
    NIVEAUX[id]=Object.assign({},NIVEAUX[id],{note:e.target.value});
    saveNiveaux();});
  document.querySelectorAll("[data-delsession]").forEach(b=>b.onclick=()=>{
    const di=+b.dataset.delsession;
    if(deleteArmed===di){LOG.sessions.splice(di,1);saveLog();deleteArmed=null;render();}
    else{deleteArmed=di;render();setTimeout(()=>{if(deleteArmed===di){deleteArmed=null;render();}},2500);}
  });

  /* édition d'un chiffre : feuille avec − / + */
  document.querySelectorAll("[data-editset]").forEach(b=>b.onclick=()=>{
    const p=b.dataset.editset.split("|");
    const session=LOG.sessions[+p[0]];
    if(!session)return;
    editTarget={si:+p[0],exId:p[1],seti:+p[2],val:session.reps[p[1]][+p[2]]};
    render();
  });
  on("shBack",()=>{editTarget=null;render();});
  on("shMinus",()=>{
    if(editTarget&&editTarget.val>0){editTarget.val--;
      const e=document.getElementById("shVal");if(e)e.textContent=editTarget.val;}});
  on("shPlus",()=>{
    if(editTarget){editTarget.val++;
      const e=document.getElementById("shVal");if(e)e.textContent=editTarget.val;}});
  on("shOk",()=>{
    if(editTarget){
      const s=LOG.sessions[editTarget.si];
      if(s)s.reps[editTarget.exId][editTarget.seti]=editTarget.val;
      saveLog();editTarget=null;render();
    }});

  on("pp",()=>{
    if(running){stepBase+=(Date.now()-stepAnchor)/1000;totBase+=(Date.now()-totAnchor)/1000;}
    else{stepAnchor=Date.now();totAnchor=Date.now();}
    running=!running;render();});
  on("done",()=>{
    const step=seq[idx];
    if(!step.timed){
      if(!sessionLog[step.id])sessionLog[step.id]=[];
      sessionLog[step.id].push(pendingReps);
    }
    beep(true);
    if(step.rest>0){phase="rest";resetStep();}else{next();}
    render();});
  on("skip",()=>{next();render();});
  on("skiprest",()=>{next();render();});
  on("add30",()=>{stepBase-=30;elapsed-=30;paintClock();});
  on("repminus",()=>{if(pendingReps>0)pendingReps--;render();});
  on("repplus",()=>{pendingReps++;render();});

  document.querySelectorAll(".stopbtn").forEach(b=>b.onclick=()=>{
    if(stopArmed){
      stopArmed=false;
      saveSessionToJournal(true);
      releaseWake();
      screen="accueil";render();
    }else{
      stopArmed=true;render();
      setTimeout(()=>{if(stopArmed){stopArmed=false;if(screen==="seance")render();}},3000);
    }
  });
}

/* ================= ÉCRAN ALLUMÉ ================= */
async function requestWake(){try{wake=await navigator.wakeLock.request("screen");}catch(e){}}
function releaseWake(){try{if(wake)wake.release();wake=null;}catch(e){}}
document.addEventListener("visibilitychange",()=>{
  if(!document.hidden){
    if(screen==="seance"){requestWake();tick();}
  }
});

/* ================= DÉMARRAGE ================= */
tickId=setInterval(tick,200);
render();

if("serviceWorker" in navigator){
  window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
}

</script>
